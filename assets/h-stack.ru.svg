<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="54" viewBox="0 0 1000 54" role="img" aria-label="Стек">
  <title>Стек</title>
  <defs>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset="0.55" stop-color="#FF2BD6" stop-opacity="0.9"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></linearGradient>
    <filter id="n" x="-40%" y="-80%" width="180%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="u" x="-40%" y="-80%" width="180%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-color="#00F0FF" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="53" rx="12" fill="#070B17" stroke="#00F0FF" stroke-opacity="0.3"/>
  <text x="22" y="33" font-family="'Fira Code', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="24" font-weight="700" letter-spacing="3" fill="#EAFDFF" filter="url(#n)"><tspan fill="#FF2BD6">// </tspan>СТЕК</text>
  <rect x="22" y="42" width="956" height="2" rx="1" fill="url(#ul)" filter="url(#u)"/>
</svg>
